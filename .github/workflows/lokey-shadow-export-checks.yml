name: Shadow export source checks
on:
  pull_request:
    paths:
      - 'Scripts/install_lokey_shadow_files_export.py'
      - 'Scripts/tests/test_lokey_shadow_files_export.py'
      - 'Scripts/install_lokey_reports_analytics.py'
      - 'Scripts/tests/test_lokey_reports_analytics.py'
      - 'Scripts/install_lokey_clinical_history_v2.py'
      - 'Scripts/install_lokey_clinical_pdf_v2.py'
      - 'Scripts/install_lokey_clinical_settings_v2.py'
      - 'Scripts/tests/test_lokey_clinical_settings_v2.py'
      - 'Scripts/tests/test_lokey_clinical_v2.py'
      - 'Scripts/install_lokey_widget_theme.py'
      - 'Scripts/tests/test_lokey_widget_theme.py'
      - 'Scripts/install_lokey_compact_status_ui.py'
      - 'Scripts/tests/test_lokey_compact_status_ui.py'
      - 'Scripts/install_lokey_quiet_dashboard.py'
      - 'Scripts/install_lokey_bolus_progress_polish.py'
      - 'Scripts/tests/test_lokey_bolus_progress_polish.py'
      - 'Scripts/tests/test_lokey_quiet_dashboard.py'
      - 'customizations/LoKeyChartColors.patch'
      - '.github/workflows/build_loop.yml'
      - '.github/workflows/build_loop_auto.yml'
      - '.github/workflows/lokey_dashboard_checks.yml'
      - '.github/workflows/lokey-shadow-export-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
# PR updates supersede older validation work; manual signed releases are separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check bolus-only progress banner presentation (no dosing actions)
        run: python3 -m unittest discover -s Scripts/tests -p test_lokey_bolus_progress_polish.py -v
      - name: Verify unread Pod Info indicator and quiet Dashboard source
        run: python3 -m unittest discover -s Scripts/tests -p test_lokey_quiet_dashboard.py -v
      - name: Verify compact LoKey device notices and read-only basal display
        run: python3 -m unittest discover -s Scripts/tests -p test_lokey_compact_status_ui.py -v
      - name: Verify targeted, fail-closed Shadow export installer
        run: python3 -m unittest discover -s Scripts/tests -p test_lokey_shadow_files_export.py -v
      - name: Test LoKey widget snapshot bridge and read-only invariants
        run: python3 -m unittest discover -s Scripts/tests -p 'test_lokey*widget*.py' -v
      - name: Parse Trio-style widget publisher and cached reader (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("Scripts/install_lokey_widget_snapshot_bridge.py")
          spec = importlib.util.spec_from_file_location("widget_snapshot_bridge", path)
          assert spec and spec.loader
          bridge = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bridge)
          Path("/tmp/LoKeyWidgetSnapshotBridge.swift").write_text(
              "import Foundation\nimport HealthKit\nimport WidgetKit\n" +
              bridge.PUBLISHER + "\n" + bridge.READER
          )
          PY
          swiftc -frontend -parse /tmp/LoKeyWidgetSnapshotBridge.swift
      - name: Validate widget Canvas renderer before macOS archive
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/tests/test_lokey_trio_widget.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("Scripts/install_lokey_trio_widget.py")
          spec = importlib.util.spec_from_file_location("lokey_widget", path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert "Canvas { context, size in" in module.WIDGET
          assert "Chart(entry.glucoseHistory)" not in module.WIDGET
          assert "import Charts" not in module.WIDGET
          Path("/tmp/LoKeyWidgetCanvas.swift").write_text(module.WIDGET)
          PY
          swiftc -frontend -parse /tmp/LoKeyWidgetCanvas.swift
      - name: Parse generated Swift source (syntax only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          script = Path("Scripts/install_lokey_shadow_files_export.py")
          spec = importlib.util.spec_from_file_location("shadow_export", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/LoKeyShadowExport.swift").write_text(
              "import SwiftUI\nimport UniformTypeIdentifiers\n" + module.REPLACEMENT
          )
          PY
          swiftc -frontend -parse /tmp/LoKeyShadowExport.swift
      - name: Validate LoKey clinical reports and pod ledger (no app build)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Scripts/tests/test_lokey_reports_analytics.py -v
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("Scripts/install_lokey_reports_analytics.py")
          spec = importlib.util.spec_from_file_location("lokey_reports", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/LoKeyReportsAnalytics.swift").write_text(
              "import SwiftUI\nimport HealthKit\nimport LoopKit\n" + module.SWIFT_SOURCE)
          PY
          swiftc -frontend -parse /tmp/LoKeyReportsAnalytics.swift
          grep -Fq 'python3 Scripts/install_lokey_reports_analytics.py' .github/workflows/build_loop.yml
          grep -Fq 'python3 Scripts/install_lokey_reports_analytics.py' .github/workflows/build_loop_auto.yml
      - name: Validate LoKey dark theme source and generated Swift (no app build)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Scripts/tests/test_lokey_widget_theme.py -v
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("Scripts/install_lokey_widget_theme.py")
          spec = importlib.util.spec_from_file_location("lokey_theme", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          Path("/tmp/LoKeyWidgetPalette.swift").write_text(
              "import Foundation\nimport UIKit\n" + mod.PALETTE
          )
          PY
          swiftc -frontend -parse /tmp/LoKeyWidgetPalette.swift
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'python3 Scripts/install_lokey_widget_theme.py' "$workflow"
          done
          grep -Fq 'UIColor(red: 0.6800, green: 0.4200, blue: 0.9900, alpha: 1)' customizations/LoKeyChartColors.patch
      - name: Verify daily CGM graphs and historical Health reader without app build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Scripts/tests/test_lokey_clinical_v2.py -v
          python3 -m unittest Scripts/tests/test_lokey_clinical_settings_v2.py -v
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          for name, filename in [
            ("clinic_history", "Scripts/install_lokey_clinical_history_v2.py"),
            ("clinic_pdf", "Scripts/install_lokey_clinical_pdf_v2.py"),
            ("clinic_settings", "Scripts/install_lokey_clinical_settings_v2.py")
          ]:
            spec = importlib.util.spec_from_file_location(name, filename)
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            if name == "clinic_history":
              Path("/tmp/LoKeyClinicalHistory.swift").write_text(
                "import Foundation\nimport HealthKit\nimport UIKit\nimport LoopKit\nimport SwiftUI\n" +
                module.HELPERS
              )
              Path("/tmp/LoKeyClinicalGenerate.swift").write_text(
                "import SwiftUI\n" + "private struct LoKeyClinicalReportView: View {\n" +
                module.GENERATE + "\n}"
              )
            elif name == "clinic_pdf":
              Path("/tmp/LoKeyClinicalDailyPDF.swift").write_text(
                "import Foundation\nimport UIKit\nimport HealthKit\nimport LoopKit\n" + module.PDF
              )
            else:
              Path("/tmp/LoKeyClinicalSettings.swift").write_text(
                "import Foundation\nimport UIKit\nimport HealthKit\nimport LoopKit\n" + module.HELPER
              )
          PY
          swiftc -frontend -parse /tmp/LoKeyClinicalHistory.swift
          swiftc -frontend -parse /tmp/LoKeyClinicalGenerate.swift
          swiftc -frontend -parse /tmp/LoKeyClinicalDailyPDF.swift
          swiftc -frontend -parse /tmp/LoKeyClinicalSettings.swift
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'python3 Scripts/install_lokey_clinical_history_v2.py' "$workflow"
            grep -Fq 'python3 Scripts/install_lokey_clinical_pdf_v2.py' "$workflow"
            grep -Fq 'python3 Scripts/install_lokey_clinical_settings_v2.py' "$workflow"
          done
      - name: Confirm all build routes install the same export fix
        run: |
          set -euo pipefail
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml .github/workflows/lokey_dashboard_checks.yml; do
            grep -Fq 'python3 Scripts/install_lokey_shadow_files_export.py' "$workflow"
          done
          grep -Fq 'fileExporter(isPresented: $showingExporter' Scripts/install_lokey_shadow_files_export.py
          grep -Fq 'No partial archive was created.' Scripts/install_lokey_shadow_files_export.py
