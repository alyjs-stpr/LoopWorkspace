name: LoKey dashboard patch validation
on:
  pull_request:
    paths:
      # Trigger preflight for every LoKey customization, not just dashboards.
      - 'customizations/*.patch'
      - 'Scripts/check_missed_meal_heuristic.py'
      - '.gitmodules'
      - 'Loop'
      - 'LoopKit'
      - 'NightscoutService'
      - 'OmnipodKit'
      - 'LoopConfigOverride.xcconfig'
      - 'VersionOverride.xcconfig'
      - 'fastlane/**'
      - 'OverrideAssetsLoop.xcassets/**'
      - 'OverrideAssetsWatchApp.xcassets/**'
      - '.github/workflows/lokey_dashboard_checks.yml'
      - '.github/workflows/create_certs.yml'
      - '.github/workflows/validate_secrets.yml'
      - '.github/workflows/build_loop*.yml'
  workflow_dispatch:

jobs:
  validate-dashboard:
    name: Patch compatibility and Swift parsing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned Loop workspace and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply existing Loop chart and reporting customizations
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyChartColors.patch
          git -C Loop apply ../customizations/LoKeyChartColors.patch
          git -C LoopKit apply --check ../customizations/LoKeyAxisReadability.patch
          git -C LoopKit apply ../customizations/LoKeyAxisReadability.patch
          git -C Loop apply --check ../customizations/LoKeyReports.patch
          git -C Loop apply ../customizations/LoKeyReports.patch
          git -C Loop apply --check ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply ../customizations/LoKeyTIRShortcut.patch
      - name: Apply LoKey dashboard and visual polish
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardFinalPass.patch
          git -C Loop apply ../customizations/LoKeyDashboardFinalPass.patch

          # Display-only Build 12 follow-up: actual axis alignment and readable history.
          git -C LoopKit apply --check ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardCleanupLoop.patch
          git -C Loop apply ../customizations/LoKeyDashboardCleanupLoop.patch

          # Adaptive Meals adds only independent tracking and local storage.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsTracking.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsTracking.patch
          # Build 13: inline measured carbs/protein and explicit carb-copy confirmation.
          # Applies after the observation-only feature; never changes the bolus engine.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch

          # Notification-only guard: avoid false missed-meal prompts after logged meals.
          git -C Loop apply --check ../customizations/LoKeyMissedMealNotificationGuard.patch
          git -C Loop apply ../customizations/LoKeyMissedMealNotificationGuard.patch
          # Build 17: history/settings cleanup, separate from Loop dosing.
          git -C Loop apply --check ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          git -C Loop apply ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          # Display-only Home Screen widget failure and stale-data handling.
          git -C Loop apply --check ../customizations/LoKeyBuild17WidgetReliability.patch
          git -C Loop apply ../customizations/LoKeyBuild17WidgetReliability.patch
          # Build 18 UI-only; protein-equivalent dosing proposal deliberately excluded.
          git -C Loop apply --check ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18ReportsUX.patch
          git -C Loop apply ../customizations/LoKeyBuild18ReportsUX.patch
          # Widget-only recovery: keep timeline completion non-blocking with fallback.
          git -C Loop apply --check ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          git -C Loop apply ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          # Build 20: one combined calculator with user-confirmed carb equivalent.
          git -C Loop apply --check ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          git -C Loop apply ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          # Build 21: record a meal once, only after native Loop CarbStore succeeds.
          git -C Loop apply --check ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
          git -C Loop apply ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
      - name: Parse modified Swift files
        shell: bash
        run: |
          set -euo pipefail
          command -v swiftc
          swiftc -frontend -parse "Loop/Loop Widget Extension/Timeline/StatusWidgetTimelineProvider.swift" "Loop/Loop Widget Extension/Components/GlucoseView.swift" "Loop/Loop/View Controllers/StatusTableViewController.swift" "Loop/LoopUI/Views/StatusBarHUDView.swift" "Loop/Loop/Views/SettingsView.swift" "Loop/Loop/Views/CarbEntryView.swift" "Loop/Loop/View Models/BolusEntryViewModel.swift" "Loop/Loop/Managers/LoopDataManager.swift" "Loop/Loop/Managers/Missed Meal Detection/MealDetectionManager.swift" "Loop/LoopTests/Managers/MealDetectionManagerTests.swift" "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift" "LoopKit/LoopKitUI/Charts/DoseChart.swift"
      - name: Execute source-derived missed-meal notification timing checks
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/check_missed_meal_heuristic.py
      # The full LoopTests XCTest suite requires an appropriately configured
      # simulator host app and is not executed by this source-level check.
      - name: Check preservation of key dashboard components
        shell: bash
        run: |
          set -euo pipefail
          FILE="Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -q 'case glucose' "$FILE"
          grep -q 'case iob' "$FILE"
          grep -q 'case dose' "$FILE"
          grep -q 'case cob' "$FILE"
          grep -q 'case metrics' "$FILE"
          grep -q 'lokeyHistoryChanged' "$FILE"
          grep -q 'LoKeyNowOverlayView' "$FILE"
          grep -q 'reportsItem' "$FILE"
          grep -q 'LoKeyCGMTIRStatistics' "Loop/Loop/Views/SettingsView.swift"
          grep -q 'Time in range (custom)' "Loop/Loop/Views/SettingsView.swift"
          grep -q 'LoKeyTargetStatistics' "Loop/Loop/Views/SettingsView.swift"
          grep -q 'tickHours' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -q 'bolusPlanned' "$FILE"
          grep -q 'lokeyInstallStatusBarScrim' "$FILE"
          grep -q 'LoKeyDashboardHistoryHours' "$FILE"
          grep -q 'useSparseTimeAxisLabels' "$FILE"
          grep -q 'plotLeadingInset' "$FILE"
          grep -q 'lokeyGlucoseDeltaTimestamp' "$FILE"
          grep -q 'Bolus · unconfirmed' "$FILE"
          grep -q 'Basal Changes + Boluses' "$FILE"
          grep -q 'marker.showsCaption = isGlucose' "$FILE"
          grep -q 'plotFraction(for date: Date)' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -q 'bolusMarkerSize' "LoopKit/LoopKitUI/Charts/DoseChart.swift"

      - name: Verify Adaptive Meals is observation-only
        shell: bash
        run: |
          set -euo pipefail
          file="Loop/Loop/Views/CarbEntryView.swift"
          grep -Fq 'LoKeyMealHistorySettingsView(data: adaptiveMeals)' "$file"
          grep -Fq 'baselineCarbs = c?.count == 4' "$file"
          grep -Fq 'baselineProtein = p?.count == 4' "$file"
          grep -Fq 'loopCarbsRecorded' "$file"
          grep -Fq 'possibleDelayedRise' "$file"
          grep -Fq 'Meal details will be saved automatically only after Loop successfully saves the carb entry.' "$file"
          # Unified entry is UI-only: explicit carb copy, native Continue and bolus remain.
          grep -Fq 'LoKeyInlineMealEntry(' "$file"
          grep -Fq 'Label("Use calculated amount in Loop"' "$file"
          grep -Fq 'Slider(value: $data.proteinFactor, in: 0...1, step: 0.05)' "$file"
          grep -Fq 'let total = carbs + protein * data.proteinFactor' "$file"
          grep -Fq 'loopCarbs = HKQuantity(unit: .gram(), doubleValue: calculated).doubleValue(for: loopCarbUnit)' "$file"
          grep -Fq 'Button(action: viewModel.continueToBolus)' "$file"
          grep -Fq 'BolusEntryView(viewModel: viewModel)' "$file"
          grep -Fq 'loggedCarbStartTimes: carbEntries.map' "Loop/Loop/Managers/LoopDataManager.swift"
          grep -Fq 'mealAlreadyLogged' "Loop/Loop/Managers/Missed Meal Detection/MealDetectionManager.swift"
          grep -Fq 'testRecentlyLoggedMealDoesNotTriggerDuplicateMissedMealAlert' "Loop/LoopTests/Managers/MealDetectionManagerTests.swift"
          grep -Fq 'testUnloggedMealStillTriggersMissedMealAlert' "Loop/LoopTests/Managers/MealDetectionManagerTests.swift"
          grep -Fq 'loopCarbsRecorded: nil' "$file"
          grep -Fq 'viewModel.lokeyOnCarbEntrySaved = ' "$file"
          grep -Fq 'adaptiveMeals.add(observation)' "$file"
          grep -Fq 'pendingObservation = nil' "$file"
          grep -Fq 'lokeyOnCarbEntrySaved?(storedCarbEntry)' "Loop/Loop/View Models/BolusEntryViewModel.swift"
          if grep -Fq 'Button("Save meal observation")' "$file"; then
            echo '::error::Duplicate manual meal-save action remains'
            exit 1
          fi
          if grep -Fq 'private struct LoKeyMealTrackingView: View' "$file"; then
            echo '::error::Duplicate meal-entry screen has not been removed'
            exit 1
          fi
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'LoKeyAdaptiveMealsTracking.patch' "$workflow"
            grep -Fq 'LoKeyAdaptiveMealsUnifiedEntry.patch' "$workflow"
            grep -Fq 'LoKeyBuild17MealHistoryCleanup.patch' "$workflow"
            grep -Fq 'LoKeyBuild17WidgetReliability.patch' "$workflow"
            grep -Fq 'LoKeyBuild18ToolbarLayout.patch' "$workflow"
            grep -Fq 'LoKeyBuild18KeyboardOnly.patch' "$workflow"
            grep -Fq 'LoKeyBuild18ReportsUX.patch' "$workflow"
            grep -Fq 'LoKeyBuild19WidgetTimeoutRecovery.patch' "$workflow"
            grep -Fq 'LoKeyBuild20UnifiedMealCalculator.patch' "$workflow"
            grep -Fq 'LoKeyBuild21ConfirmedMealCapture.patch' "$workflow"
            if grep -Fq 'LoKeyBuild18MealUX.patch' "$workflow"; then
              echo "::error::The unreviewed protein-equivalent carb transfer is not release-approved."
              exit 1
            fi
          done

      - name: Verify approved cleanup controls across both build routes
        shell: bash
        run: |
          set -euo pipefail
          insights=customizations/LoKeyDashboardInsights.patch
          final=customizations/LoKeyDashboardFinalPass.patch
          # History selection must persist and restore, not just look selected.
          grep -Fq 'UserDefaults.standard.set(hours, forKey: "LoKeyDashboardHistoryHours")' "$insights"
          grep -Fq 'UserDefaults.standard.integer(forKey: "LoKeyDashboardHistoryHours")' "$insights"
          grep -Fq 'selector.selectedSegmentTintColor' "$insights"
          # Predictions, status-bar protection, axis alignment, and flexible HUDs.
          grep -Fq 'forecastChip("30m"' "$insights"
          grep -Fq 'forecastChip("60m"' "$insights"
          grep -Fq 'host.safeAreaLayoutGuide.topAnchor' "$insights"
          grep -Fq 'marker.plotLeadingInset = charts.plotLeadingInset' "$final"
          grep -Fq 'marker.plotTrailingInset = charts.plotTrailingInset' "$final"
          grep -Fq 'glucoseRatio.priority = .defaultHigh' "$final"
          grep -Fq 'pumpRatio.priority = .defaultHigh' "$final"
          # Check every LoKey customization remains in BOTH build paths, not just
          # the dashboard subset. This avoids publishing an incomplete build.
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            for patch in customizations/*.patch; do
              patchname="${patch##*/}"
              # Experimental protein-based carb transfer remains review-only.
              if [[ "$patchname" == "LoKeyBuild18MealUX.patch" ]]; then
                continue
              fi
              grep -Fq "$patchname" "$workflow" || {
                echo "::error::$workflow does not apply $patchname"
                exit 1
              }
            done
          done
          # Widget safety: old readings remain explicitly labelled stale, never live.
          grep -Fq 'STALE · ' customizations/LoKeyBuild17WidgetReliability.patch
          grep -Fq 'completion(StatusWidgetTimelimeEntry(' customizations/LoKeyBuild17WidgetReliability.patch
          grep -Fq 'filter({ $0 > newEntry.date }).sorted()' customizations/LoKeyBuild17WidgetReliability.patch

          # Build 18 must keep the native Loop carb confirmation and bolus step.
          grep -Fq 'Button("Done")' customizations/LoKeyBuild18KeyboardOnly.patch
          grep -Fq 'targetsItem.menu = UIMenu' customizations/LoKeyBuild18ToolbarLayout.patch
          grep -Fq 'pickerStyle(.menu)' customizations/LoKeyBuild18ReportsUX.patch
          grep -Fq 'let total = carbs + protein * data.proteinFactor' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'Label("Use calculated amount in Loop"' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'lastAppliedEquivalent = calculated' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'viewModel.lokeyOnCarbEntrySaved =' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'self.lokeyOnCarbEntrySaved?(storedCarbEntry)' "Loop/Loop/View Models/BolusEntryViewModel.swift"
          grep -Fq 'Loop carbs (review or edit)' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'Button(action: viewModel.continueToBolus)' Loop/Loop/Views/CarbEntryView.swift
          # Exactly one meal entry component appears inside the native mainCard.
          [ "$(grep -Fc 'LoKeyInlineMealEntry(' Loop/Loop/Views/CarbEntryView.swift)" -eq 1 ]
          if grep -Fq 'showCopyConfirmation' Loop/Loop/Views/CarbEntryView.swift; then
            echo '::error::Duplicate calculator confirmation remains'
            exit 1
          fi

          # Widget update should never synchronously wait for glucose cache.
          grep -Fq 'private final class EntryCompletion' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          grep -Fq 'delivery.finish(Self.unavailableEntry())' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          grep -Fq 'asyncAfter(deadline: .now() + 4)' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          if grep -Fq 'group.wait()' Loop/'Loop Widget Extension'/Timeline/StatusWidgetTimelineProvider.swift; then
            echo '::error::Blocking widget cache wait remains'
            exit 1
          fi

          # Manual builds must use a reviewed immutable SHA.
          grep -Fq 'github.sha' .github/workflows/build_loop.yml
          # Scheduled builds / upstream changes are only enabled via explicit opt-in.
          grep -Fq "vars.SCHEDULED_BUILD == 'true'" .github/workflows/build_loop_auto.yml
          grep -Fq "vars.SCHEDULED_SYNC == 'true'" .github/workflows/build_loop_auto.yml

          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'LoKeyAxisReadability.patch' "$workflow"
            grep -Fq 'LoKeyReports.patch' "$workflow"
            grep -Fq 'LoKeyDashboardInsights.patch' "$workflow"
            grep -Fq 'LoKeyDashboardPolish.patch' "$workflow"
            grep -Fq 'LoKeyDashboardFinalPass.patch' "$workflow"
            grep -Fq 'LoKeyDashboardCleanupLoop.patch' "$workflow"
            grep -Fq 'LoKeyDashboardCleanupLoopKit.patch' "$workflow"
          done

  compile-ios:
    # Manual pre-merge validation must compile Swift too, not just parse patches.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Unsigned iOS simulator compile (no upload)
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Checkout pinned workspace and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply LoKey changes in production build order
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyChartColors.patch
          git -C Loop apply ../customizations/LoKeyChartColors.patch
          git -C LoopKit apply --check ../customizations/LoKeyFoodEmojis.patch
          git -C LoopKit apply ../customizations/LoKeyFoodEmojis.patch
          git -C LoopKit apply --check ../customizations/LoKeyAxisReadability.patch
          git -C LoopKit apply ../customizations/LoKeyAxisReadability.patch
          git -C Loop apply --check ../customizations/LoKeyReports.patch
          git -C Loop apply ../customizations/LoKeyReports.patch
          git -C Loop apply --check ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardFinalPass.patch
          git -C Loop apply ../customizations/LoKeyDashboardFinalPass.patch

          # Display-only Build 12 follow-up: actual axis alignment and readable history.
          git -C LoopKit apply --check ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardCleanupLoop.patch
          git -C Loop apply ../customizations/LoKeyDashboardCleanupLoop.patch

          # Adaptive Meals adds only independent tracking and local storage.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsTracking.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsTracking.patch
          # Build 13: inline measured carbs/protein and explicit carb-copy confirmation.
          # Applies after the observation-only feature; never changes the bolus engine.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch

          # Notification-only guard: avoid false missed-meal prompts after logged meals.
          git -C Loop apply --check ../customizations/LoKeyMissedMealNotificationGuard.patch
          git -C Loop apply ../customizations/LoKeyMissedMealNotificationGuard.patch
          # Build 17: history/settings cleanup, separate from Loop dosing.
          git -C Loop apply --check ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          git -C Loop apply ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          # Display-only Home Screen widget failure and stale-data handling.
          git -C Loop apply --check ../customizations/LoKeyBuild17WidgetReliability.patch
          git -C Loop apply ../customizations/LoKeyBuild17WidgetReliability.patch
          # Build 18 UI-only; protein-equivalent dosing proposal deliberately excluded.
          git -C Loop apply --check ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18ReportsUX.patch
          git -C Loop apply ../customizations/LoKeyBuild18ReportsUX.patch
          # Widget-only recovery: keep timeline completion non-blocking with fallback.
          git -C Loop apply --check ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          git -C Loop apply ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          # Build 20: one combined calculator with user-confirmed carb equivalent.
          git -C Loop apply --check ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          git -C Loop apply ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          # Build 21: record a meal once, only after native Loop CarbStore succeeds.
          git -C Loop apply --check ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
          git -C Loop apply ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
          git -C NightscoutService apply --check ../customizations/LoKeyT1PalNightscout.patch
          git -C NightscoutService apply ../customizations/LoKeyT1PalNightscout.patch
      # This is a source compilation smoke test, not an installable app package.
      # The unsigned simulator run can fail the final bundle validator because
      # Loop's .loopplugin bundles are treated as regular .framework folders.
      # Full validation remains enabled in the real signed TestFlight workflow.
      - name: Compile without signing or publishing
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/lokey-dashboard-build.log"
          set +e
          xcodebuild \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            VALIDATE_PRODUCT=NO \
            -derivedDataPath "$RUNNER_TEMP/lokey-dashboard-build" \
            build 2>&1 | tee "$log"
          build_exit=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit" -eq 0 ]; then
            echo "Unsigned simulator compile and bundle validation passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Xcode 27 still validates .loopplugin frameworks when VALIDATE_PRODUCT=NO.
          # Accept ONLY one or two previously observed plugin Info.plist errors,
          # with no other compiler/packaging errors, and ONLY at final Validate.
          # This is an unsigned simulator source smoke test, NOT a signed package.
          error_count="$(grep -Ec '^error:' "$log" || true)"
          unexpected_errors="$(grep '^error:' "$log" | grep -Ev "^error: Framework .*/Loop[.]app/Frameworks/(AmplitudeServiceKitPlugin|LoopOnboardingPlugin)[.]framework did not contain an Info[.]plist [(]in target 'Loop' from project 'Loop'[)]$" || true)"
          if [ "$error_count" -ge 1 ] && [ "$error_count" -le 2 ] \
            && [ -z "$unexpected_errors" ] \
            && ! grep -Eq '[.]swift:[0-9]+:[0-9]+: error:' "$log" \
            && grep -Eq "^[[:space:]]*Validate .*/Loop[.]app [(]in target 'Loop' from project 'Loop'[)]$" "$log" \
            && grep -Fq '** BUILD FAILED **' "$log" \
            && grep -Fq '(2 failures)' "$log" \
            && [ "$(grep -Ec "^[[:space:]]+Validate .*[(]in target 'Loop' from project 'Loop'[)]$" "$log" || true)" -eq 1 ]; then
            echo 'validation_only=true' >> "$GITHUB_OUTPUT"
            echo "::warning title=Known unsigned bundle-validation limitation::Swift compilation reached app validation; Xcode 27 rejected $error_count pre-existing plugin framework(s) without Info.plist. Signed TestFlight packaging is NOT verified."
            {
              echo '### Simulator smoke test: source compilation completed; bundle validation remains unverified'
              echo "Only $error_count recognized unsigned plugin Info.plist validation error(s) were observed, and final Validate was the sole failed build command."
              echo 'This exception NEVER applies to signed TestFlight packaging. Physical-device safety review remains necessary.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=iOS simulator build failed::Not exclusively a recognized final unsigned plugin framework validation issue; inspect the full log."
          exit "$build_exit"
      # An unsigned Loop.app cannot reliably bootstrap its hosted XCTest runner
      # in this CI environment. Do not present a runner crash as a dosing-code
      # regression or claim the native iOS XCTest suite was executed.
      - name: Save compilation log if failed or bundle validation was exempted
        if: failure() || steps.compile.outputs.validation_only == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lokey-ios-compile-log
          path: ${{ runner.temp }}/lokey-dashboard-build.log
          retention-days: 5
