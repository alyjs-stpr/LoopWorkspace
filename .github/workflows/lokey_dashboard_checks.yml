name: LoKey dashboard patch validation
on:
  pull_request:
    paths:
      # Trigger preflight for every LoKey customization, not just dashboards.
      - 'customizations/*.patch'
      - 'Scripts/check_missed_meal_heuristic.py'
      - '.gitmodules'
      - 'Loop'
      - 'LoopKit'
      - 'NightscoutService'
      - 'OmnipodKit'
      - 'LoopConfigOverride.xcconfig'
      - 'VersionOverride.xcconfig'
      - 'fastlane/**'
      - 'OverrideAssetsLoop.xcassets/**'
      - 'OverrideAssetsWatchApp.xcassets/**'
      - '.github/workflows/lokey_dashboard_checks.yml'
      - '.github/workflows/create_certs.yml'
      - '.github/workflows/validate_secrets.yml'
      - '.github/workflows/build_loop*.yml'
  workflow_dispatch:

jobs:
  validate-dashboard:
    name: Patch compatibility and Swift parsing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned Loop workspace and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply existing Loop chart and reporting customizations
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyChartColors.patch
          git -C Loop apply ../customizations/LoKeyChartColors.patch
          git -C LoopKit apply --check ../customizations/LoKeyAxisReadability.patch
          git -C LoopKit apply ../customizations/LoKeyAxisReadability.patch
          # Exact chart-axis endpoints; read-only presentation fix.
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild26ExactAxisBounds.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild26ExactAxisBounds.patch
          git -C Loop apply --check ../customizations/LoKeyReports.patch
          git -C Loop apply ../customizations/LoKeyReports.patch
          git -C Loop apply --check ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply ../customizations/LoKeyTIRShortcut.patch
      - name: Apply LoKey dashboard and visual polish
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardFinalPass.patch
          git -C Loop apply ../customizations/LoKeyDashboardFinalPass.patch

          # Display-only Build 12 follow-up: actual axis alignment and readable history.
          git -C LoopKit apply --check ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28SplitTimeAxisCore.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28SplitTimeAxisCore.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28GlucoseProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28GlucoseProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28PredictionsProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28PredictionsProjection.patch
          # LoKey dashboard-only observed glucose line, with CGM gap protection.
          git -C LoopKit apply --check ../customizations/LoKeyBuild29SolidGlucoseHistory.patch
          git -C LoopKit apply ../customizations/LoKeyBuild29SolidGlucoseHistory.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28TargetScheduleDates.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28TargetScheduleDates.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28IOBProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28IOBProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28COBProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28COBProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28DoseProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28DoseProjection.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardCleanupLoop.patch
          git -C Loop apply ../customizations/LoKeyDashboardCleanupLoop.patch

          # Adaptive Meals adds only independent tracking and local storage.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsTracking.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsTracking.patch
          # Build 13: inline measured carbs/protein and explicit carb-copy confirmation.
          # Applies after the observation-only feature; never changes the bolus engine.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsUnifiedEntry.patch

          # Notification-only guard: avoid false missed-meal prompts after logged meals.
          git -C Loop apply --check ../customizations/LoKeyMissedMealNotificationGuard.patch
          git -C Loop apply ../customizations/LoKeyMissedMealNotificationGuard.patch
          # Build 17: history/settings cleanup, separate from Loop dosing.
          git -C Loop apply --check ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          git -C Loop apply ../customizations/LoKeyBuild17MealHistoryCleanup.patch
          # Display-only Home Screen widget failure and stale-data handling.
          git -C Loop apply --check ../customizations/LoKeyBuild17WidgetReliability.patch
          git -C Loop apply ../customizations/LoKeyBuild17WidgetReliability.patch
          # Build 18 UI-only; protein-equivalent dosing proposal deliberately excluded.
          git -C Loop apply --check ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply ../customizations/LoKeyBuild18ToolbarLayout.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply ../customizations/LoKeyBuild18KeyboardOnly.patch
          git -C Loop apply --check ../customizations/LoKeyBuild18ReportsUX.patch
          git -C Loop apply ../customizations/LoKeyBuild18ReportsUX.patch
          # Widget-only recovery: keep timeline completion non-blocking with fallback.
          git -C Loop apply --check ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          git -C Loop apply ../customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          # Build 20: one combined calculator with user-confirmed carb equivalent.
          git -C Loop apply --check ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          git -C Loop apply ../customizations/LoKeyBuild20UnifiedMealCalculator.patch
          # Build 21: record a meal once, only after native Loop CarbStore succeeds.
          git -C Loop apply --check ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
          git -C Loop apply ../customizations/LoKeyBuild21ConfirmedMealCapture.patch
          # Theme Park Mode: independent temporary correction target and
          # native carb-save options. Existing insulin prediction stays unchanged.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyThemeParkMode.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyThemeParkMode.patch
          # Forecast selector: one hour of history plus the next 1 / 3 / 6 hours.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyForecastWindows.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyForecastWindows.patch
          # Simplify meal entry and suggest the meal type using its timestamp.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyMealEntryPolish.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyMealEntryPolish.patch
          # UI-only: keep the Now overlay visible before generated chart ticks exist.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyNowMarkerStability.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyNowMarkerStability.patch
          # Compact interactive park control center, separate from Loop dosing.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyParkControls.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyParkControls.patch
          # Adaptive Shadow: read-only evaluation before subsequent presentation cleanups.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyAdaptiveShadowCapture.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyAdaptiveShadowCapture.patch
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyAdaptiveShadowUI.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyAdaptiveShadowUI.patch
          python3 Scripts/verify_adaptive_shadow_core.py
          # Build 24 UI-only cleanup: one-tap Meal button remains canonical.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild24BolusKeyboardAndParkMealCleanup.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild24BolusKeyboardAndParkMealCleanup.patch
          # Build 25: view-only fixed chart timeline and independent last-bolus history.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild25FixedTimeline.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild25FixedTimeline.patch
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild25LastBolusSummary.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild25LastBolusSummary.patch
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild25MarkerRefresh.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild25MarkerRefresh.patch
          # Build 27: balanced, display-only 3h history / 6h forecast timeline.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild27BalancedHistory.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild27BalancedHistory.patch
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild28StatusView.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild28StatusView.patch
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild32NativePages.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild32NativePages.patch
          # Central LoKey-specific settings hub (UI-only; shared Shadow opt-in key).
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeySettingsHub.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeySettingsHub.patch
          # Build 33: Shadow submenu with on-device, read-only record dashboard.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild33ShadowDashboard.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild33ShadowDashboard.patch
          # Build 35: live dashboard age, bolus and carbs refresh after Loop fetches.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild35LiveDashboardRefresh.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild35LiveDashboardRefresh.patch
          # Final native tab layout, one safety-aware glucose HUD, insulin summary, pod details.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyBuild36FinishNativeUI.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyBuild36FinishNativeUI.patch
          # Restore the approved Build 32 purple glucose card without an extra native HUD row.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyRestoreBuild32PurpleDashboard.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyRestoreBuild32PurpleDashboard.patch
          # Observe CGM updates after user reports a suspected pod leak; no dosing changes.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeySuspectedPodLeakAnnotation.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeySuspectedPodLeakAnnotation.patch
          # Keep the approved purple card, but never repeat the healthy CGM
          # reading in the native HUD. Show native CGM tiles for alerts/stale data.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeySingleGlucoseDashboard.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeySingleGlucoseDashboard.patch
          # Approved mockups: full purple current CGM + large trend, green insulin,
          # pod details, compact safety HUD and 4-button toolbar.
          git -C Loop apply --unidiff-zero --check ../customizations/LoKeyApprovedScreensFinalUI.patch
          git -C Loop apply --unidiff-zero ../customizations/LoKeyApprovedScreensFinalUI.patch
          # Expose native Omnipod pod replacement from Pod Info without sending pump commands.
          git -C Loop apply --check ../customizations/LoKeyPodChangeShortcut.patch
          git -C Loop apply ../customizations/LoKeyPodChangeShortcut.patch
          # Pod-specific leak supervision: four successive >7 mg/dL rises;
          # six hours from actual replacement pod activation; no dosing changes.
          python3 Scripts/install_lokey_pod_leak_supervisor.py
          # Keep the header's last successful Loop time in sync with native
          # green/yellow/red freshness; tapping opens native Loop status.
          python3 Scripts/install_lokey_loop_status_shortcut.py
          grep -Fq 'LoopCompletionFreshness(lastCompletion: last)' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          grep -Fq 'loKeyLastSuccessfulLoopTapped' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          grep -Fq 'Last successful Loop: ' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          grep -Fq 'Previous pod leak watch' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          # Regression guards for pod identity, six-hour expiry and alert rule.
          grep -Fq 'activePod > reportedPod.addingTimeInterval(60)' 'Loop/Loop/Managers/DeviceDataManager.swift'
          grep -Fq 'replacement.addingTimeInterval(6 * 60 * 60)' 'Loop/Loop/Managers/DeviceDataManager.swift'
          grep -Fq 'currentMgDl - previousMgDl > 7' 'Loop/Loop/Managers/DeviceDataManager.swift'
          grep -Fq 'consecutiveRises >= 4' 'Loop/Loop/Managers/DeviceDataManager.swift'
          # Guard against a no-op shortcut and accidental direct pump command.
          grep -Fq 'changePodButton.setTitle("Change Pod", for: .normal)' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          grep -Fq 'self.executeHUDTapAction(self.deviceManager.didTapOnPumpStatus(), from: self.view)' 'Loop/Loop/View Controllers/StatusTableViewController.swift'
          # Preserve pump-reported decimal reservoir precision below 50 U.
          # Above threshold remains 50+ U; no synthetic estimate.
          git -C OmnipodKit apply --check ../customizations/LoKeyBuild29PreciseReservoir.patch
          git -C OmnipodKit apply ../customizations/LoKeyBuild29PreciseReservoir.patch
          git -C OmnipodKit apply --unidiff-zero --check ../customizations/LoKeyBuild36PodTelemetry.patch
          git -C OmnipodKit apply --unidiff-zero ../customizations/LoKeyBuild36PodTelemetry.patch
      - name: Parse modified Swift files
        shell: bash
        run: |
          set -euo pipefail
          command -v swiftc
          swiftc -frontend -parse "Loop/Loop Widget Extension/Timeline/StatusWidgetTimelineProvider.swift" "Loop/Loop Widget Extension/Components/GlucoseView.swift" "Loop/Loop/View Controllers/StatusTableViewController.swift" "Loop/LoopUI/Views/StatusBarHUDView.swift" "Loop/Loop/Views/SettingsView.swift" "Loop/Loop/Views/CarbEntryView.swift" "Loop/Loop/Views/BolusEntryView.swift" "Loop/Loop/View Models/BolusEntryViewModel.swift" "Loop/Loop/Managers/LoopDataManager.swift" "Loop/Loop/Managers/Missed Meal Detection/MealDetectionManager.swift" "Loop/LoopTests/Managers/MealDetectionManagerTests.swift" "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift" "LoopKit/LoopKitUI/Charts/DoseChart.swift"
      - name: Execute source-derived missed-meal notification timing checks
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/check_missed_meal_heuristic.py
      # The full LoopTests XCTest suite requires an appropriately configured
      # simulator host app and is not executed by this source-level check.
      - name: Check preservation of key dashboard components
        shell: bash
        run: |
          set -euo pipefail
          FILE="Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -q 'case glucose' "$FILE"
          grep -q 'case iob' "$FILE"
          grep -q 'case dose' "$FILE"
          grep -q 'case cob' "$FILE"
          grep -q 'case metrics' "$FILE"
          grep -q 'lokeyForecastChanged' "$FILE"
          grep -q 'LoKeyNowOverlayView' "$FILE"
          grep -q 'reportsItem' "$FILE"
          grep -q 'LoKeyCGMTIRStatistics' "Loop/Loop/Views/SettingsView.swift"
          grep -q 'Time in range (custom)' "Loop/Loop/Views/SettingsView.swift"
          grep -q 'LoKeyTargetStatistics' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'LoKeySettingsView(viewModel: viewModel)' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'NavigationLink(destination: LoKeyAdaptiveShadowSettingsView())' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'NavigationLink(destination: LoKeyShadowDashboardView())' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'LoKeyShadowRecordReader.readRecent()' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'Label("Glucose reports & settings PDF", systemImage: "chart.pie")' "Loop/Loop/Views/SettingsView.swift"
          # Only one native Loop safety HUD and one custom metrics row.
          grep -Fq 'case .hud, .metrics:' "$FILE"
          grep -Fq 'return shouldShowHUD ? 1 : 0' "$FILE"
          grep -Fq 'withIdentifier: HUDViewTableViewCell.className' "$FILE"
          grep -Fq 'LoKeyQuickStatsCell.id' "$FILE"
          # The new card must update after the asynchronous Loop snapshot completes.
          grep -Fq 'self.loKeyQuickStatsCell?.update(' "$FILE"
          grep -Fq 'self.loKeyRefreshHeader()' "$FILE"
          grep -Fq 'loKeyQuickStatsCell = cell' "$FILE"
          # Native CGM and pump warnings must remain visible, with one glucose tile.
          grep -Fq 'hudView?.setLoKeyDashboardMode(false)' "$FILE"
          grep -Fq 'loKeyGlucoseHeaderCard?.update(' "$FILE"
          grep -Fq 'trendArrow.font = .systemFont(ofSize: 44' "$FILE"
          grep -Fq 'loKeyNeedsNativeStatusHUD' "$FILE"
          grep -Fq 'toolbarItems = [carbsItem, bolusItem, reportsItem, settingsItem]' "$FILE"
          grep -Fq 'LoKeyInsulinCard.id' "$FILE"
          grep -Fq 'Report Suspected Pod Leak' "$FILE"
          grep -Fq 'cell.onPumpStatus' "$FILE"
          grep -Fq 'setLoKeyCompactDashboardMode(loKeyPage == .dashboard)' "$FILE"
          grep -Fq 'glucoseCard.addGestureRecognizer(cgmDetailsTap)' "$FILE"
          grep -Fq 'setLoKeyCompactDashboardMode(_ enabled: Bool)' "Loop/LoopUI/Views/StatusBarHUDView.swift"
          grep -Fq 'cgmTile.isHidden = loKeyCompactDashboardMode && !cgmStatusHUD.loKeyRequiresAttention' "Loop/LoopUI/Views/StatusBarHUDView.swift"
          grep -Fq 'loKeyHasActiveStatusNotice' "Loop/LoopUI/Views/DeviceStatusHUDView.swift"
          grep -Fq 'loKeyAttentionChanged' "Loop/LoopUI/Views/CGMStatusHUDView.swift"
          # The leak warning is CGM-driven (not dashboard-only) and cannot
          # change Loop's insulin math or pump commands.
          grep -Fq 'loKeyCurrentPodLeakFlagged()' "$FILE"
          grep -Fq 'LoKeyDeliveryLeakActiveV1' "Loop/Loop/Views/BolusEntryView.swift"
          grep -Fq 'loKeyCheckSuspectedPodLeakAfterCGM()' "Loop/Loop/Managers/DeviceDataManager.swift"
          grep -Fq 'let sustainedSpike = consecutiveRises >= 4' "Loop/Loop/Managers/DeviceDataManager.swift"
          grep -Fq 'let veryHigh = glucose >= 250' "Loop/Loop/Managers/DeviceDataManager.swift"
          grep -Fq 'glucoseCard.topAnchor.constraint(equalTo: tabs.bottomAnchor' "$FILE"
          grep -Fq 'tableView.contentInset.bottom = max(tableView.contentInset.bottom, 105)' "$FILE"
          grep -Fq 'LoKeyInsulinCard.id' "$FILE"
          grep -Fq 'raw["podExpiresAt"]' "$FILE"
          grep -Fq 'raw["podActivatedAt"]' "$FILE"
          grep -Fq 'setLoKeyDashboardMode(_ enabled: Bool)' "Loop/LoopUI/Views/StatusBarHUDView.swift"
          grep -Fq 'rawValue["podExpiresAt"] = pumpManager.podExpiresAt' "OmnipodKit/OmnipodKit/PumpManagerUI/OmniHUDProvider.swift"
          grep -Fq 'case charts' "$FILE"
          grep -Fq 'case metrics' "$FILE"
          if grep -Fq 'let hudRows = (0..<(loKeyPage == .dashboard ? 2 : 1)).map' "$FILE"; then
            echo '::error::Duplicated dashboard HUD row returned'
            exit 1
          fi
          grep -Fq '@AppStorage("LoKeyAdaptiveShadowEnabledV1")' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'Toggle("Record live shadow decisions", isOn: $shadowEnabled)' "Loop/Loop/Views/SettingsView.swift"
          grep -Fq 'Label("Glucose reports & settings PDF", systemImage: "chart.pie")' "Loop/Loop/Views/SettingsView.swift"
          if grep -Fq 'Section(header: Text("Adaptive Shadow · observation only"))' "Loop/Loop/View Controllers/StatusTableViewController.swift"; then
            echo "::error::Adaptive Shadow controls still appear in Theme Park panel"
            exit 1
          fi
          grep -q 'tickHours' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -q 'bolusPlanned' "$FILE"
          grep -q 'lokeyInstallStatusBarScrim' "$FILE"
          grep -q 'LoKeyDashboardForecastHoursV1' "$FILE"
          grep -q 'useSparseTimeAxisLabels' "$FILE"
          grep -q 'plotLeadingInset' "$FILE"
          grep -q 'lokeyGlucoseDeltaTimestamp' "$FILE"
          grep -q 'Bolus · unconfirmed' "$FILE"
          grep -q 'Basal Changes + Boluses' "$FILE"
          grep -q 'marker.showsCaption = isGlucose' "$FILE"
          grep -q 'plotFraction(for date: Date)' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -q 'bolusMarkerSize' "LoopKit/LoopKitUI/Charts/DoseChart.swift"

      - name: Verify Adaptive Meals is observation-only
        shell: bash
        run: |
          set -euo pipefail
          file="Loop/Loop/Views/CarbEntryView.swift"
          grep -Fq 'LoKeyMealHistorySettingsView(data: adaptiveMeals)' "$file"
          grep -Fq 'baselineCarbs = c?.count == 4' "$file"
          grep -Fq 'baselineProtein = p?.count == 4' "$file"
          grep -Fq 'loopCarbsRecorded' "$file"
          grep -Fq 'possibleDelayedRise' "$file"
          grep -Fq 'Meal details are recorded only after Loop saves carbs. Cancel discards the entry.' "$file"
          # Unified entry is UI-only: explicit carb copy, native Continue and bolus remain.
          grep -Fq 'LoKeyInlineMealEntry(' "$file"
          grep -Fq 'Label("Use calculated amount in Loop"' "$file"
          grep -Fq 'Slider(value: $data.proteinFactor, in: 0...1, step: 0.05)' "$file"
          grep -Fq 'let total = carbs + protein * data.proteinFactor' "$file"
          grep -Fq 'loopCarbs = HKQuantity(unit: .gram(), doubleValue: calculated).doubleValue(for: loopCarbUnit)' "$file"
          grep -Fq 'Button(action: viewModel.continueToBolus)' "$file"
          grep -Fq 'BolusEntryView(viewModel: viewModel)' "$file"
          grep -Fq 'loggedCarbStartTimes: carbEntries.map' "Loop/Loop/Managers/LoopDataManager.swift"
          grep -Fq 'mealAlreadyLogged' "Loop/Loop/Managers/Missed Meal Detection/MealDetectionManager.swift"
          grep -Fq 'testRecentlyLoggedMealDoesNotTriggerDuplicateMissedMealAlert' "Loop/LoopTests/Managers/MealDetectionManagerTests.swift"
          grep -Fq 'testUnloggedMealStillTriggersMissedMealAlert' "Loop/LoopTests/Managers/MealDetectionManagerTests.swift"
          grep -Fq 'loopCarbsRecorded: nil' "$file"
          grep -Fq 'viewModel.lokeyOnCarbEntrySaved = ' "$file"
          grep -Fq 'adaptiveMeals.add(observation)' "$file"
          grep -Fq 'pendingObservation = nil' "$file"
          grep -Fq 'lokeyOnCarbEntrySaved?(storedCarbEntry)' "Loop/Loop/View Models/BolusEntryViewModel.swift"
          grep -Fq 'private var activeParkOverride: TemporaryScheduleOverride?' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'private var pausedParkSession:' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'Pause Park Targets' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'Normal Loop targets are active. Insulin delivery is not paused.' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'LoKeyThemeParkView(' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'loKeySaveWithoutBolus()' "Loop/Loop/View Models/BolusEntryViewModel.swift"
          grep -Fq 'Button("Save Without Bolusing")' "Loop/Loop/Views/BolusEntryView.swift"
          grep -Fq 'lokeyForecastHours = 6' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'chartEndDate = anchor.addingTimeInterval(TimeInterval(hours: 6))' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'chartStartDate = anchor.addingTimeInterval(-TimeInterval(hours: 1))' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'Past 1h (expanded) · Next 6h · ' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'statusCharts.loKeyExpandOneHourHistory = true' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'LoKeyDisplayDateAxisValue' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -Fq 'date: scale.actualDate(for: displayed)' "LoopKit/LoopKitUI/View Controllers/ChartsManager.swift"
          grep -Fq 'UIStackView(arrangedSubviews: [predictions])' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'currentPlotFraction' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          grep -Fq 'latestBolusSummaryDoses' "Loop/Loop/View Controllers/StatusTableViewController.swift"
          if grep -Fq 'UISegmentedControl(items: ["1h", "3h", "6h"])' "Loop/Loop/View Controllers/StatusTableViewController.swift"; then
            echo "::error::The removed forecast selector is still present."
            exit 1
          fi
          grep -Fq 'LoKeyMealKind = .suggested(for: Date())' "Loop/Loop/Views/CarbEntryView.swift"
          grep -Fq 'DisclosureGroup("Optional meal details")' "Loop/Loop/Views/CarbEntryView.swift"
          grep -Fq 'mealWasManuallyChosen' "Loop/Loop/Views/CarbEntryView.swift"
          if grep -Fq 'Button("Save meal observation")' "$file"; then
            echo '::error::Duplicate manual meal-save action remains'
            exit 1
          fi
          if grep -Fq 'private struct LoKeyMealTrackingView: View' "$file"; then
            echo '::error::Duplicate meal-entry screen has not been removed'
            exit 1
          fi
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'LoKeyAdaptiveMealsTracking.patch' "$workflow"
            grep -Fq 'LoKeyAdaptiveMealsUnifiedEntry.patch' "$workflow"
            grep -Fq 'LoKeyBuild17MealHistoryCleanup.patch' "$workflow"
            grep -Fq 'LoKeyBuild17WidgetReliability.patch' "$workflow"
            grep -Fq 'LoKeyBuild18ToolbarLayout.patch' "$workflow"
            grep -Fq 'LoKeyBuild18KeyboardOnly.patch' "$workflow"
            grep -Fq 'LoKeyBuild18ReportsUX.patch' "$workflow"
            grep -Fq 'LoKeyBuild19WidgetTimeoutRecovery.patch' "$workflow"
            grep -Fq 'LoKeyBuild20UnifiedMealCalculator.patch' "$workflow"
            grep -Fq 'LoKeyBuild21ConfirmedMealCapture.patch' "$workflow"
            if grep -Fq 'LoKeyBuild18MealUX.patch' "$workflow"; then
              echo "::error::The unreviewed protein-equivalent carb transfer is not release-approved."
              exit 1
            fi
          done

      - name: Verify approved cleanup controls across both build routes
        shell: bash
        run: |
          set -euo pipefail
          insights=customizations/LoKeyDashboardInsights.patch
          final=customizations/LoKeyDashboardFinalPass.patch
          # History selection must persist and restore, not just look selected.
          grep -Fq 'UserDefaults.standard.set(hours, forKey: "LoKeyDashboardHistoryHours")' "$insights"
          grep -Fq 'UserDefaults.standard.integer(forKey: "LoKeyDashboardHistoryHours")' "$insights"
          grep -Fq 'selector.selectedSegmentTintColor' "$insights"
          # Predictions, status-bar protection, axis alignment, and flexible HUDs.
          grep -Fq 'forecastChip("30m"' "$insights"
          grep -Fq 'forecastChip("60m"' "$insights"
          grep -Fq 'host.safeAreaLayoutGuide.topAnchor' "$insights"
          grep -Fq 'marker.plotLeadingInset = charts.plotLeadingInset' "$final"
          grep -Fq 'marker.plotTrailingInset = charts.plotTrailingInset' "$final"
          grep -Fq 'glucoseRatio.priority = .defaultHigh' "$final"
          grep -Fq 'pumpRatio.priority = .defaultHigh' "$final"
          # Check every LoKey customization remains in BOTH build paths, not just
          # the dashboard subset. This avoids publishing an incomplete build.
          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            for patch in customizations/*.patch; do
              patchname="${patch##*/}"
              # Experimental protein-based carb transfer remains review-only.
              if [[ "$patchname" == "LoKeyBuild18MealUX.patch" || "$patchname" == "LoKeyBuild33PreserveDashboard.patch" ]]; then
                # The latter inserts a duplicate native HUD row. Keep both
                # excluded from the signed routes without deleting audit files.
                continue
              fi
              grep -Fq "$patchname" "$workflow" || {
                echo "::error::$workflow does not apply $patchname"
                exit 1
              }
            done
          done
          # Widget safety: old readings remain explicitly labelled stale, never live.
          grep -Fq 'STALE · ' customizations/LoKeyBuild17WidgetReliability.patch
          grep -Fq 'completion(StatusWidgetTimelimeEntry(' customizations/LoKeyBuild17WidgetReliability.patch
          grep -Fq 'filter({ $0 > newEntry.date }).sorted()' customizations/LoKeyBuild17WidgetReliability.patch

          # Build 18 must keep the native Loop carb confirmation and bolus step.
          grep -Fq 'Button("Done")' customizations/LoKeyBuild18KeyboardOnly.patch
          grep -Fq 'targetsItem.menu = UIMenu' customizations/LoKeyBuild18ToolbarLayout.patch
          grep -Fq 'pickerStyle(.menu)' customizations/LoKeyBuild18ReportsUX.patch
          grep -Fq 'let total = carbs + protein * data.proteinFactor' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'Label("Use calculated amount in Loop"' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'lastAppliedEquivalent = calculated' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'viewModel.lokeyOnCarbEntrySaved =' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'self.lokeyOnCarbEntrySaved?(storedCarbEntry)' "Loop/Loop/View Models/BolusEntryViewModel.swift"
          grep -Fq 'Loop carbs (review or edit)' Loop/Loop/Views/CarbEntryView.swift
          grep -Fq 'Button(action: viewModel.continueToBolus)' Loop/Loop/Views/CarbEntryView.swift
          # Exactly one meal entry component appears inside the native mainCard.
          [ "$(grep -Fc 'LoKeyInlineMealEntry(' Loop/Loop/Views/CarbEntryView.swift)" -eq 1 ]
          if grep -Fq 'showCopyConfirmation' Loop/Loop/Views/CarbEntryView.swift; then
            echo '::error::Duplicate calculator confirmation remains'
            exit 1
          fi

          # Widget update should never synchronously wait for glucose cache.
          grep -Fq 'private final class EntryCompletion' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          grep -Fq 'delivery.finish(Self.unavailableEntry())' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          grep -Fq 'asyncAfter(deadline: .now() + 4)' customizations/LoKeyBuild19WidgetTimeoutRecovery.patch
          if grep -Fq 'group.wait()' Loop/'Loop Widget Extension'/Timeline/StatusWidgetTimelineProvider.swift; then
            echo '::error::Blocking widget cache wait remains'
            exit 1
          fi

          # Manual builds must use a reviewed immutable SHA.
          grep -Fq 'github.sha' .github/workflows/build_loop.yml
          # Scheduled builds / upstream changes are only enabled via explicit opt-in.
          grep -Fq "vars.SCHEDULED_BUILD == 'true'" .github/workflows/build_loop_auto.yml
          grep -Fq "vars.SCHEDULED_SYNC == 'true'" .github/workflows/build_loop_auto.yml

          for workflow in .github/workflows/build_loop.yml .github/workflows/build_loop_auto.yml; do
            grep -Fq 'LoKeyAxisReadability.patch' "$workflow"
            grep -Fq 'LoKeyBuild26ExactAxisBounds.patch' "$workflow"
            grep -Fq 'LoKeyBuild28SplitTimeAxisCore.patch' "$workflow"
            grep -Fq 'LoKeyBuild28GlucoseProjection.patch' "$workflow"
            grep -Fq 'LoKeyBuild28PredictionsProjection.patch' "$workflow"
            grep -Fq 'LoKeyBuild28TargetScheduleDates.patch' "$workflow"
            grep -Fq 'LoKeyBuild28IOBProjection.patch' "$workflow"
            grep -Fq 'LoKeyBuild28COBProjection.patch' "$workflow"
            grep -Fq 'LoKeyBuild28DoseProjection.patch' "$workflow"
            grep -Fq 'LoKeyBuild28StatusView.patch' "$workflow"
            grep -Fq 'LoKeyReports.patch' "$workflow"
            grep -Fq 'LoKeyDashboardInsights.patch' "$workflow"
            grep -Fq 'LoKeyDashboardPolish.patch' "$workflow"
            grep -Fq 'LoKeyDashboardFinalPass.patch' "$workflow"
            grep -Fq 'LoKeyNowMarkerStability.patch' "$workflow"
            grep -Fq 'LoKeyParkControls.patch' "$workflow"
            grep -Fq 'LoKeyAdaptiveShadowCapture.patch' "$workflow"
            grep -Fq 'LoKeyAdaptiveShadowUI.patch' "$workflow"
            grep -Fq 'LoKeyBuild24BolusKeyboardAndParkMealCleanup.patch' "$workflow"
            grep -Fq 'LoKeyBuild25FixedTimeline.patch' "$workflow"
            grep -Fq 'LoKeyBuild25LastBolusSummary.patch' "$workflow"
            grep -Fq 'LoKeyBuild25MarkerRefresh.patch' "$workflow"
            grep -Fq 'LoKeyBuild27BalancedHistory.patch' "$workflow"
            grep -Fq 'LoKeyDashboardCleanupLoop.patch' "$workflow"
            grep -Fq 'LoKeyDashboardCleanupLoopKit.patch' "$workflow"
          done

  compile-ios:
    # Manual pre-merge validation must compile Swift too, not just parse patches.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Unsigned iOS simulator compile (no upload)
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Checkout pinned workspace and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply LoKey changes in production build order
        shell: bash
        run: |
          set -euo pipefail
          git -C Loop apply --check ../customizations/LoKeyChartColors.patch
          git -C Loop apply ../customizations/LoKeyChartColors.patch
          git -C LoopKit apply --check ../customizations/LoKeyFoodEmojis.patch
          git -C LoopKit apply ../customizations/LoKeyFoodEmojis.patch
          git -C LoopKit apply --check ../customizations/LoKeyAxisReadability.patch
          git -C LoopKit apply ../customizations/LoKeyAxisReadability.patch
          # Exact chart-axis endpoints; read-only presentation fix.
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild26ExactAxisBounds.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild26ExactAxisBounds.patch
          git -C Loop apply --check ../customizations/LoKeyReports.patch
          git -C Loop apply ../customizations/LoKeyReports.patch
          git -C Loop apply --check ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply ../customizations/LoKeyTIRShortcut.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply ../customizations/LoKeyDashboardInsights.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply ../customizations/LoKeyDashboardPolish.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardFinalPass.patch
          git -C Loop apply ../customizations/LoKeyDashboardFinalPass.patch

          # Display-only Build 12 follow-up: actual axis alignment and readable history.
          git -C LoopKit apply --check ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply ../customizations/LoKeyDashboardCleanupLoopKit.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28SplitTimeAxisCore.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28SplitTimeAxisCore.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28GlucoseProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28GlucoseProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28PredictionsProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28PredictionsProjection.patch
          # LoKey dashboard-only observed glucose line, with CGM gap protection.
          git -C LoopKit apply --check ../customizations/LoKeyBuild29SolidGlucoseHistory.patch
          git -C LoopKit apply ../customizations/LoKeyBuild29SolidGlucoseHistory.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28TargetScheduleDates.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28TargetScheduleDates.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28IOBProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28IOBProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28COBProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28COBProjection.patch
          git -C LoopKit apply --unidiff-zero --check ../customizations/LoKeyBuild28DoseProjection.patch
          git -C LoopKit apply --unidiff-zero ../customizations/LoKeyBuild28DoseProjection.patch
          git -C Loop apply --check ../customizations/LoKeyDashboardCleanupLoop.patch
          git -C Loop apply ../customizations/LoKeyDashboardCleanupLoop.patch

          # Adaptive Meals adds only independent tracking and local storage.
          git -C Loop apply --check ../customizations/LoKeyAdaptiveMealsTracking.patch
          git -C Loop apply ../customizations/LoKeyAdaptiveMealsTracking.patch
          # Build 13: inline measured carbs/protein and explicit carb-copy confirmation.
