name: LoKeyFollow
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LoKeyFollow:
    type: application
    platform: iOS
    sources: [App, Shared, Core/Sources/FollowCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lokey.follow
        CODE_SIGN_ENTITLEMENTS: Shared/Follow.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LoKey Follow
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        FollowKeychainGroup: "$(AppIdentifierPrefix)net.lokey.follow.shared"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: net.lokey.follow
            CFBundleURLSchemes: [lokeyfollow]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - target: FollowWidgets
        embed: true
  FollowWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared, Core/Sources/FollowCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lokey.follow.widgets
        CODE_SIGN_ENTITLEMENTS: Shared/Follow.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: LoKey Follow Widgets
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        FollowKeychainGroup: "$(AppIdentifierPrefix)net.lokey.follow.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  LoKeyFollow:
    build:
      targets:
        LoKeyFollow: all
